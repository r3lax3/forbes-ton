<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forbes Telegram | Top 100</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Access denied screen (shown when not in Telegram) -->
<div class="access-denied" id="accessDenied" style="display:none;">
    <p id="accessDeniedText"></p>
</div>

<!-- Main app (hidden until Telegram is validated) -->
<div class="container" id="mainApp" style="display:none;">
    <div class="header">
        <h1 id="titleText">FORBES <span id="titleTg">TG</span></h1>
        <div class="subhead" id="subtitleText"></div>
    </div>

    <div class="lang-selector" id="langSelector">
        <button data-lang="ru" class="active">🇷🇺 RU</button>
        <button data-lang="en">🇬🇧 EN</button>
        <button data-lang="zh">🇨🇳 ZH</button>
    </div>

    <div class="promo">
        <span class="promo-text" id="promoText"></span>
        <span class="promo-stars" id="promoStars"></span>
    </div>

    <div class="stats">
        <span id="statTotalLabel"></span>
        <span id="statOnlineLabel"></span>
    </div>

    <div class="rank-table" id="rankTable">
        <div class="rank-header">
            <div id="headerRank">#</div>
            <div id="headerName"></div>
            <div id="headerChannels"></div>
            <div id="headerStars"></div>
        </div>
        <div id="rankRows"></div>
    </div>

    <div class="metrics">
        <div class="metric-card">
            <div class="metric-value" id="participantsCount">0</div>
            <div class="metric-label" id="participantsLabel"></div>
        </div>
        <div class="metric-card">
            <div class="metric-value" id="needForTop1">0</div>
            <div class="metric-label" id="needForTop1Label"></div>
        </div>
        <div class="metric-card">
            <div class="metric-value" id="needForTop100">0</div>
            <div class="metric-label" id="needForTop100Label"></div>
        </div>
    </div>

    <div class="add-form">
        <h3 id="formTitle"></h3>
        <div class="form-grid">
            <div class="input-group">
                <label id="labelName"></label>
                <input type="text" id="nameInput" maxlength="100">
            </div>
            <div class="input-group">
                <label id="labelDesc"></label>
                <input type="text" id="descInput" maxlength="200">
            </div>
            <div class="input-group">
                <label id="labelAssets"></label>
                <input type="text" id="assetsInput" maxlength="500">
            </div>
            <div class="input-group">
                <label id="labelAmount"></label>
                <input type="number" id="amountInput" min="1" step="1" value="10">
            </div>
            <button class="btn" id="addBtn"></button>
        </div>
        <div id="errorMsg" style="color: #ffaa00; margin-top: 15px; text-align: center; display: none;"></div>
    </div>

    <footer id="footerText"></footer>
</div>

<script src="app.js"></script>
</body>
</html>
